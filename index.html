<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Открываем в Яндекс Браузере…</title>
<style>
  :root{
    --bg:#0f0f05;
    --fg:#1a1a14;
    --muted:#6d6d5e;
    --yellow:#f9ab00;        /* фирменный желтый Яндекса */
    --card:#1a1a10;
    --line:#2f2f20;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(249,171,0,.18), transparent 60%),
      var(--bg);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:420px;text-align:center}

  /* Сигнатурный элемент: пульсирующий радар-орб */
  .orb{position:relative;width:104px;height:104px;margin:0 auto 36px}
  .orb .core{
    position:absolute;inset:50% auto auto 50%;
    width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffd66a, var(--yellow) 70%);
    box-shadow:0 0 28px rgba(249,171,0,.55);
  }
  .orb .ring{
    position:absolute;inset:0;border-radius:50%;
    border:2px solid var(--yellow);opacity:0;
    animation:pulse 2.4s cubic-bezier(.2,.6,.2,1) infinite;
  }
  .orb .ring:nth-child(2){animation-delay:.8s}
  .orb .ring:nth-child(3){animation-delay:1.6s}
  @keyframes pulse{
    0%{transform:scale(.5);opacity:.9}
    100%{transform:scale(1);opacity:0}
  }

  h1{font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-.02em;margin:0 0 10px}
  p{color:var(--muted);font-size:15px;line-height:1.5;margin:0 auto;max-width:32ch}
  .host{color:var(--fg);font-weight:600;word-break:break-all}

  .actions{margin-top:30px;display:flex;flex-direction:column;gap:12px;opacity:0;transform:translateY(8px);
    transition:opacity .4s ease, transform .4s ease}
  .actions.show{opacity:1;transform:none}
  .btn{
    appearance:none;border:0;cursor:pointer;text-decoration:none;
    display:block;padding:15px 18px;border-radius:14px;
    font-size:16px;font-weight:600;letter-spacing:-.01em;
  }
  .btn-primary{background:var(--yellow);color:#1a1a14;box-shadow:0 8px 24px rgba(249,171,0,.35)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-size:14px;padding:12px}

  .foot{margin-top:22px;font-size:12px;color:#5a5a63}

  @media (prefers-reduced-motion:reduce){
    .orb .ring{animation:none;opacity:.4}
    .actions{transition:none}
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="orb" aria-hidden="true">
      <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <span class="core"></span>
    </div>

    <h1 id="title">Открываем в Яндекс&nbsp;Браузере…</h1>
    <p id="subtitle">Переходим на <span class="host" id="host">сайт</span></p>

    <div class="actions" id="actions">
      <a class="btn btn-primary" id="installBtn" href="#">Установить Яндекс Браузер</a>
      <button class="btn btn-ghost" id="retryBtn" type="button">Попробовать открыть ещё раз</button>
    </div>

    <div class="foot">Если ничего не произошло — нажмите кнопку выше.</div>
  </main>

<script>
(function(){
  "use strict";

  // ── Целевая ссылка (захардкожена) ───────────────────────────
  // Открывается ТОЛЬКО этот адрес. Параметры из URL намеренно игнорируются,
  // чтобы страницу нельзя было использовать как открытый редирект.
  // Чтобы сменить цель — отредактируйте строку ниже.
  var TARGET = "https://ya.ru";

  var IOS_SCHEME   = "yandexbrowser-open-url://";                 // схема Яндекс Браузера на iOS
  var APPSTORE     = "https://apps.apple.com/app/id483693909";    // Яндекс Браузер в App Store
  var ANDROID_PKG  = "com.yandex.browser";                        // пакет приложения на Android
  var PLAY_STORE   = "https://play.google.com/store/apps/details?id=" + ANDROID_PKG;

  var FALLBACK_DELAY = 2500; // мс ожидания перед уходом в стор
  var REVEAL_DELAY   = 1800; // мс до показа ручных кнопок

  // ── Определение платформы ───────────────────────────────────
  var ua        = navigator.userAgent || "";
  var isIOS     = /iPad|iPhone|iPod/.test(ua) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS
  var isAndroid = /Android/.test(ua);
  var STORE     = isIOS ? APPSTORE : PLAY_STORE;

  // ── UI ──────────────────────────────────────────────────────
  try { document.getElementById("host").textContent = new URL(TARGET).hostname; }
  catch (e) { document.getElementById("host").textContent = TARGET; }

  document.getElementById("installBtn").setAttribute("href", STORE);

  // Отслеживаем, ушёл ли пользователь из вкладки — значит приложение открылось,
  // и уводить в стор уже не нужно.
  var left = false;
  function markLeft(){ left = true; }
  document.addEventListener("visibilitychange", function(){ if (document.hidden) markLeft(); });
  window.addEventListener("pagehide", markLeft);
  window.addEventListener("blur", markLeft);

  function goToStore(){
    if (left) return;            // приложение уже открылось
    location.href = STORE;
  }

  // ── Попытка открыть Яндекс Браузер ──────────────────────────
  function openYandex(){
    if (isAndroid) {
      // Android-интент со встроенным фолбэком в Google Play, если пакета нет.
      var noScheme = TARGET.replace(/^https?:\/\//, "");
      var scheme   = /^http:\/\//.test(TARGET) ? "http" : "https";
      var intent   =
        "intent://" + noScheme +
        "#Intent;scheme=" + scheme +
        ";package=" + ANDROID_PKG +
        ";S.browser_fallback_url=" + encodeURIComponent(PLAY_STORE) +
        ";end";
      location.href = intent;
      setTimeout(goToStore, FALLBACK_DELAY); // подстраховка
    } else if (isIOS) {
      // iOS: открываем по схеме, через таймаут уходим в App Store, если не открылось.
      // URL передаём percent-encoded, иначе внутренний "://" ломает парсинг
      // и Яндекс.Браузер открывает только "https" вместо полного адреса.
      location.href = IOS_SCHEME + encodeURIComponent(TARGET);
      setTimeout(goToStore, FALLBACK_DELAY);
    } else {
      // Десктоп / прочее: приложения нет — просто открываем сайт.
      document.getElementById("title").textContent = "Открываем сайт…";
      location.href = TARGET;
    }
  }

  // Кнопки на случай, если автопереход заблокирован браузером.
  document.getElementById("retryBtn").addEventListener("click", function(){
    left = false;
    openYandex();
  });

  // Показать ручные кнопки чуть позже.
  setTimeout(function(){
    document.getElementById("actions").classList.add("show");
  }, REVEAL_DELAY);

  // Стартуем.
  openYandex();
})();
</script>
</body>
</html>
